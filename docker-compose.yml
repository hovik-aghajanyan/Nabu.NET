# Runs both samples and MCP Inspector together to showcase Nabu's
# per-identity tool exposure on both protocol layers:
#
#   docker compose up --build
#   open http://localhost:6274?MCP_INSPECTOR_API_TOKEN=nabu-local-dev
#
# The Inspector's server list has three connections per sample, each hitting
# the SAME endpoint:
#   todo-anonymous    -> weather tools + todos_get_priorities only
#   todo-alice-user   -> + alice's todo tools
#   todo-root-admin   -> + todos_delete (admin-only)
#   books-anonymous   -> books_search + books_get only
#   books-alice-user  -> + books_add
#   books-root-admin  -> + books_remove (admin-only)
#   chat-anonymous    -> the two read tools of the SignalR chat hub
#   chat-alice-user   -> + chat_send_message, chat_who_am_i, presence tools
#   chat-root-admin   -> + chat_delete_message (admin-only)
#
# The chat sample also serves a browser client at http://localhost:5082 -
# open it, sign in, then call chat_send_message from the Inspector and watch
# the message arrive in the browser live.
#
# The same comparison, scriptable:
#   docker compose run --rm inspector --cli --config /shared/mcp-servers.json \
#     --server todo-anonymous --method tools/list
#   docker compose run --rm inspector --cli --config /shared/mcp-servers.json \
#     --server books-root-admin --method tools/list
services:
  todo-api:
    build:
      context: .
      dockerfile: samples/Nabu.Sample.TodoApi/Dockerfile
    # 5080 to stay clear of macOS AirPlay, which squats on port 5000.
    ports:
      - "5080:8080"
    environment:
      # The demo tokens are minted once at startup; keep them alive for a day.
      Jwt__LifetimeMinutes: "1440"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The same tools-per-identity demo, served through the official
  # ModelContextProtocol C# SDK instead of Nabu's built-in protocol layer.
  official-sdk-api:
    build:
      context: .
      dockerfile: samples/Nabu.Sample.OfficialSdk/Dockerfile
    ports:
      - "5081:8080"
    environment:
      Jwt__LifetimeMinutes: "1440"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 2s
      timeout: 3s
      retries: 30

  # SignalR hub methods published as MCP tools through Nabu.Mcp.AspNetCore.SignalR,
  # plus a live browser client on the same hub.
  chat-api:
    build:
      context: .
      dockerfile: samples/Nabu.Sample.ChatHub/Dockerfile
    ports:
      - "5082:8080"
    environment:
      Jwt__LifetimeMinutes: "1440"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: logs in as alice and root on both samples, writes the Inspector
  # catalog with anonymous / alice / root connections per sample into the
  # shared volume.
  inspector-config:
    image: curlimages/curl:latest
    # The curl image defaults to a non-root user that cannot write to the
    # root-owned named volume.
    user: "0"
    volumes:
      - inspector-shared:/shared
      - ./docker/generate-inspector-config.sh:/generate-inspector-config.sh:ro
    entrypoint: ["/bin/sh", "/generate-inspector-config.sh"]
    depends_on:
      todo-api:
        condition: service_healthy
      official-sdk-api:
        condition: service_healthy
      chat-api:
        condition: service_healthy

  inspector:
    build:
      context: docker
      dockerfile: inspector.Dockerfile
    # --config (not --catalog): the read-only session config is served as-is,
    # while a writable catalog would try to move the Authorization headers into
    # the OS keyring, which does not exist inside the container.
    command: ["--config", "/shared/mcp-servers.json"]
    # The Inspector stores per-server secrets via the kernel keyring, and
    # Docker's default seccomp profile blocks the keyctl syscalls (EPERM).
    # Fine for a local demo; do not ship this to a shared host.
    security_opt:
      - seccomp=unconfined
    environment:
      # Fixed UI token so the URL in the comment above always works.
      MCP_INSPECTOR_API_TOKEN: nabu-local-dev
      MCP_SANDBOX_PORT: "6275"
      ALLOWED_ORIGINS: "http://localhost:6274"
    ports:
      - "6274:6274"
      - "6275:6275"
    volumes:
      - inspector-shared:/shared
    depends_on:
      inspector-config:
        condition: service_completed_successfully

volumes:
  inspector-shared:
