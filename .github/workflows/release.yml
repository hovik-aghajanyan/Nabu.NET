name: Release

# Publishing is driven entirely by tags: push `v1.2.3` and that exact version is built, tested,
# packed and pushed to nuget.org. The tag is the single source of truth for the package version,
# so `VersionPrefix` in Directory.Build.props never has to be kept in sync by hand.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (for example 1.2.3)."
        required: true
        type: string
      dry_run:
        description: "Build and pack, but do not push to nuget.org."
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  # Required for NuGet Trusted Publishing: the workflow exchanges a GitHub OIDC
  # token for a short-lived nuget.org API key, so no long-lived secret exists.
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    name: Pack and publish to NuGet
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${TAG_NAME#v}"
          fi

          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${version}' is not a valid package version. Tag releases as v<major>.<minor>.<patch>[-prerelease]." >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          case "${version}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Publishing version ${version}."

      - name: Restore
        run: dotnet restore Nabu.NET.sln

      - name: Build
        run: >-
          dotnet build Nabu.NET.sln
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >-
          dotnet test Nabu.NET.sln
          --configuration Release
          --no-build
          -p:Version=${{ steps.version.outputs.version }}

      # All packages are packed at the same version, so each extension's project reference to
      # Nabu.Mcp.AspNetCore becomes a NuGet dependency on the version released alongside it.
      - name: Pack
        run: |
          set -euo pipefail
          for project in \
            src/Nabu.Mcp.AspNetCore/Nabu.Mcp.AspNetCore.csproj \
            src/Nabu.Mcp.ModelContextProtocol/Nabu.Mcp.ModelContextProtocol.csproj \
            src/Nabu.Mcp.AspNetCore.SignalR/Nabu.Mcp.AspNetCore.SignalR.csproj
          do
            dotnet pack "${project}" \
              --configuration Release \
              --no-build \
              --output artifacts \
              -p:Version=${{ steps.version.outputs.version }} \
              -p:ContinuousIntegrationBuild=true
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: artifacts/*
          if-no-files-found: error

      # Trusted Publishing: exchanges this run's OIDC token for a short-lived API key.
      # The matching policy on nuget.org is what authorizes this repository + workflow.
      - name: Log in to NuGet
        if: ${{ !inputs.dry_run }}
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: hovjan

      - name: Push to NuGet
        if: ${{ !inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          # The matching .snupkg is picked up automatically alongside each .nupkg.
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${NUGET_API_KEY}" \
            --source "${NUGET_SOURCE}" \
            --skip-duplicate

      # Manually dispatched runs have no tag yet, so one is created once the push has
      # succeeded. Tag-triggered runs already run on their tag and skip this. Pushing the
      # tag with GITHUB_TOKEN does not re-trigger this workflow, so nothing publishes twice.
      - name: Create and push the release tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.dry_run }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null 2>&1; then
            echo "Tag ${tag} already exists; leaving it as is."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${tag}"
            git push origin "${tag}"
          fi

      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "Release ${tag} already exists; leaving it as is."
          else
            gh release create "${tag}" \
              --title "${tag}" \
              --generate-notes \
              ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }} \
              artifacts/*
          fi
